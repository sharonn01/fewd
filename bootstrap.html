<!DOCTYPE html>
<html>
<head>
<title>Bootstrap Components</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
font-family:"Times New Roman";
}
</style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">

<a class="navbar-brand" href="#">MySite</a>

<button class="navbar-toggler" type="button"
data-bs-toggle="collapse"
data-bs-target="#menu">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="#">Home</a></li>
<li class="nav-item"><a class="nav-link" href="#">Services</a></li>
<li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
</ul>

</div>
</div>
</nav>

<!-- Cards -->
<div class="container mt-5">
<div class="row g-4">

<div class="col-md-4">
<div class="card">

<div class="card-body">
<h5 class="card-title">Web Design</h5>
<p class="card-text">Modern responsive web design.</p>

<button class="btn btn-primary"
data-bs-toggle="modal"
data-bs-target="#infoModal">
View Details
</button>

</div>
</div>
</div>

<div class="col-md-4">
<div class="card">

<div class="card-body">
<h5 class="card-title">Development</h5>
<p class="card-text">Frontend development services.</p>
</div>

</div>
</div>

<div class="col-md-4">
<div class="card">

<div class="card-body">
<h5 class="card-title">Hosting</h5>
<p class="card-text">Website deployment solutions.</p>
</div>

</div>
</div>

</div>
</div>

<!-- Modal -->
<div class="modal fade" id="infoModal">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">
<h5 class="modal-title">Service Information</h5>

<button class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">
<p>
This website demonstrates Bootstrap components such as Navbar,
Cards, and Modal popup.
</p>
</div>

<div class="modal-footer">
<button class="btn btn-secondary" data-bs-dismiss="modal">
Close
</button>
</div>

</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
