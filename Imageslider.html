<!DOCTYPE html>
<html>
<head>
<title>Beautiful Image Slider</title>

<style>
body{
    font-family:"Times New Roman";
    text-align:center;
    background:#f2f2f2;
}

.slider{
    width:600px;
    margin:50px auto;
}

.slider img{
    width:100%;
    height:350px;
    border-radius:12px;
    object-fit:cover;
    box-shadow:0px 4px 10px rgba(0,0,0,0.3);
}

button{
    padding:10px 18px;
    margin:10px;
    font-size:16px;
    border:none;
    border-radius:5px;
    background:#333;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#555;
}
</style>

<script>
let images=[
    "https://picsum.photos/id/1015/600/350",
    "https://picsum.photos/id/1016/600/350",
    "https://picsum.photos/id/1025/600/350",
    "https://picsum.photos/id/1035/600/350"
];

let index=0;

function showImage(){
    document.getElementById("slide").src=images[index];
}

function nextImage(){
    index=(index+1)%images.length;
    showImage();
}

function prevImage(){
    index=(index-1+images.length)%images.length;
    showImage();
}

setInterval(nextImage,3000);
</script>

</head>

<body onload="showImage()">

<h2>Image Slider / Carousel</h2>

<div class="slider">
    <img id="slide" src="">
</div>

<button onclick="prevImage()">Previous</button>
<button onclick="nextImage()">Next</button>

</body>
</html>
